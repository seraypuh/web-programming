<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>MacShop</title>
    </head>
    <body>
        <header>
            <h1>Добро пожаловать в MacShop!</h1>
        </header>
        <main>
            <section class="catalog">
                <h2>Каталог</h2>
                <div class="product-grid">
                    <article class="product-card">
                        <img src="images/m1.jpeg" alt="MacBook Air M1" class="product-img">
                        <h3>MacBook Air 13" M1</h3>
                        <p class="price">$999</p>
                        <button class="add-to-cart-btn" data-name="MacBook Air 13&quot; M1" data-price="999">В корзину</button>
                    </article>

                    <article class="product-card">
                        <img src="images/m2.jpeg" alt="MacBook Air M2" class="product-img">
                        <h3>MacBook Air 13" M2</h3>
                        <p class="price">$1299</p>
                        <button class="add-to-cart-btn" data-name="MacBook Air 13&quot; M2" data-price="1299">В корзину</button>
                    </article>

                    <article class="product-card">
                        <img src="images/m3.jpeg" alt="MacBook Air M3" class="product-img">
                        <h3>MacBook Air 13" M3</h3>
                        <p class="price">$1499</p>
                        <button class="add-to-cart-btn" data-name="MacBook Air 13&quot; M3" data-price="1499">В корзину</button>
                    </article>

                    <article class="product-card">
                        <img src="images/m4.jpeg" alt="MacBook Air M4" class="product-img">
                        <h3>MacBook Air 13" M4</h3>
                        <p class="price">$1999</p>
                        <button class="add-to-cart-btn" data-name="MacBook Air 13&quot; M4" data-price="1999">В корзину</button>
                    </article>
                </div>
            </section>
            <section class="cart">
                <h2>Корзина</h2>
                <div class="cart-items">
                    <p>Корзина пуста</p>
                </div>
                <p class="cart-total">Итого: $<span id="total-price">0</span></p>
                <button class="checkout-btn">Оформить заказ</button>
            </section>
            <div id="modal" class="modal">
                <div class="modal-content">
                    <span class="close-btn">&times;</span>
                    <h2>Оформление заказа</h2>
                    <form id="order-form">
                        <label for="first-name">Имя:</label>
                        <input type="text" id="first-name" required>

                        <label for="last-name">Фамилия:</label>
                        <input type="text" id="last-name" required>

                        <label for="address">Адрес доставки:</label>
                        <input type="text" id="address" required>

                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" required>

                        <button type="submit">Создать заказ</button>
                    </form>
                </div>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
