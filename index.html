<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>MacShop</title>
    </head>
    <body>
        <header>
            <h1>Welcome to MacShop!</h1>
        </header>
        <main>
            <section class="catalog">
                <h2>Catalog</h2>
                <div class="product-grid">
                    <article class="product-card">
                        <h3>MacBook Air 13" M1</h3>
                        <p>Price: $999</p>
                        <button>Add to Cart</button>
                    </article>
                    <article class="product-card">
                        <h3>MacBook Air 13" M2</h3>
                        <p>Price: $1299</p>
                        <button>Add to Cart</button>
                    </article>
                    <article class="product-card">
                        <h3>MacBook Air 13" M3</h3>
                        <p>Price: $1499</p>
                        <button>Add to Cart</button>
                    </article>
                    <article class="product-card">
                        <h3>MacBook Air 13" M4</h3>
                        <p>Price: $1999</p>
                        <button>Add to Cart</button>
                    </article>
                </div>
            </section>
            <section>
                <h2>Cart</h2>
            </section>
        </main>
    </body>
</html>
